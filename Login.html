<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | My Website</title>

    <!-- Font Awesome for icons (optional but nice) -->
    <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />

    <style>
        /* ---------- RESET & BASE ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        /* ---------- LOGIN CARD ---------- */
        .login-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-radius: 2.5rem;
            padding: 2.5rem 2.8rem;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: transform 0.3s ease;
        }

        .login-card:hover {
            transform: translateY(-4px);
        }

        /* ---------- HEADER ---------- */
        .login-header {
            text-align: center;
            margin-bottom: 2.2rem;
        }

        .login-header .icon {
            font-size: 3rem;
            color: #a78bfa;
            background: rgba(167, 139, 250, 0.15);
            width: 80px;
            height: 80px;
            line-height: 80px;
            border-radius: 50%;
            margin: 0 auto 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(167, 139, 250, 0.2);
        }

        .login-header h1 {
            color: #ffffff;
            font-weight: 600;
            font-size: 1.9rem;
            letter-spacing: -0.5px;
        }

        .login-header p {
            color: rgba(255, 255, 255, 0.55);
            font-size: 0.95rem;
            margin-top: 0.3rem;
        }

        /* ---------- FORM ---------- */
        .login-form {
            display: flex;
            flex-direction: column;
            gap: 1.4rem;
        }

        /* --- Input groups --- */
        .input-group {
            position: relative;
        }

        .input-group i {
            position: absolute;
            left: 1.2rem;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.35);
            font-size: 1.1rem;
            transition: color 0.3s;
        }

        .input-group input {
            width: 100%;
            padding: 1rem 1rem 1rem 3.2rem;
            background: rgba(255, 255, 255, 0.06);
            border: 1.5px solid rgba(255, 255, 255, 0.08);
            border-radius: 1.8rem;
            font-size: 1rem;
            color: #ffffff;
            outline: none;
            transition: border-color 0.3s, background 0.3s, box-shadow 0.3s;
            font-weight: 400;
        }

        .input-group input::placeholder {
            color: rgba(255, 255, 255, 0.3);
            font-weight: 300;
        }

        .input-group input:focus {
            border-color: #a78bfa;
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 0 4px rgba(167, 139, 250, 0.15);
        }

        .input-group input:focus+i {
            color: #a78bfa;
        }

        /* --- Password toggle --- */
        .toggle-password {
            position: absolute;
            right: 1.2rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.3);
            cursor: pointer;
            font-size: 1.1rem;
            padding: 0.3rem;
            transition: color 0.3s;
        }

        .toggle-password:hover {
            color: rgba(255, 255, 255, 0.7);
        }

        /* --- Options row (remember + forgot) --- */
        .form-options {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: -0.2rem;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.9rem;
            cursor: pointer;
        }

        .remember-me input[type="checkbox"] {
            appearance: none;
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.04);
            cursor: pointer;
            position: relative;
            transition: background 0.2s, border-color 0.2s;
            flex-shrink: 0;
        }

        .remember-me input[type="checkbox"]:checked {
            background: #a78bfa;
            border-color: #a78bfa;
        }

        .remember-me input[type="checkbox"]:checked::after {
            content: "✓";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 12px;
            font-weight: 700;
        }

        .forgot-link {
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.9rem;
            text-decoration: none;
            transition: color 0.3s;
            font-weight: 400;
        }

        .forgot-link:hover {
            color: #a78bfa;
        }

        /* --- Login button --- */
        .btn-login {
            background: linear-gradient(135deg, #7c3aed, #6d28d9);
            border: none;
            padding: 1rem;
            border-radius: 1.8rem;
            font-size: 1.05rem;
            font-weight: 600;
            color: #ffffff;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.25s, background 0.3s;
            box-shadow: 0 8px 24px rgba(124, 58, 237, 0.35);
            letter-spacing: 0.3px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            margin-top: 0.2rem;
        }

        .btn-login:hover {
            transform: scale(1.02);
            box-shadow: 0 12px 32px rgba(124, 58, 237, 0.5);
            background: linear-gradient(135deg, #8b5cf6, #7c3aed);
        }

        .btn-login:active {
            transform: scale(0.97);
        }

        .btn-login i {
            font-size: 1.1rem;
        }

        /* --- Loading state --- */
        .btn-login.loading {
            pointer-events: none;
            opacity: 0.8;
        }

        .btn-login .spinner {
            display: none;
            width: 22px;
            height: 22px;
            border: 3px solid rgba(255, 255, 255, 0.2);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        .btn-login.loading .spinner {
            display: inline-block;
        }

        .btn-login.loading .btn-text {
            display: none;
        }

        .btn-login.loading i {
            display: none;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* --- Sign up link --- */
        .signup-link {
            text-align: center;
            color: rgba(255, 255, 255, 0.45);
            font-size: 0.95rem;
            margin-top: 0.2rem;
        }

        .signup-link a {
            color: #a78bfa;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s;
        }

        .signup-link a:hover {
            color: #c4b5fd;
            text-decoration: underline;
        }

        /* ---------- ERROR / MESSAGE ---------- */
        .form-message {
            text-align: center;
            font-size: 0.9rem;
            padding: 0.6rem 1rem;
            border-radius: 1.2rem;
            display: none;
            margin-top: -0.2rem;
        }

        .form-message.error {
            display: block;
            background: rgba(239, 68, 68, 0.15);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .form-message.success {
            display: block;
            background: rgba(52, 211, 153, 0.12);
            color: #6ee7b7;
            border: 1px solid rgba(52, 211, 153, 0.15);
        }

        /* ---------- RESPONSIVE ---------- */
        @media (max-width: 480px) {
            .login-card {
                padding: 2rem 1.6rem;
                border-radius: 2rem;
            }

            .login-header h1 {
                font-size: 1.6rem;
            }

            .input-group input {
                padding: 0.9rem 1rem 0.9rem 2.8rem;
                font-size: 0.95rem;
            }

            .input-group i {
                left: 1rem;
                font-size: 1rem;
            }

            .form-options {
                flex-wrap: wrap;
                gap: 0.6rem;
            }

            .btn-login {
                padding: 0.9rem;
                font-size: 1rem;
            }
        }

        @media (max-width: 380px) {
            .login-card {
                padding: 1.5rem 1.2rem;
            }
        }
    </style>
</head>

<body>

    <div class="login-card" role="main" aria-labelledby="login-heading">

        <!-- HEADER -->
        <div class="login-header">
            <div class="icon">
                <i class="fas fa-lock"></i>
            </div>
            <h1 id="login-heading">Welcome Back</h1>
            <p>Sign in to your account</p>
        </div>

        <!-- FORM -->
        <form class="login-form" id="loginForm" novalidate>

            <!-- Email / Username -->
            <div class="input-group">
                <i class="fas fa-envelope"></i>
                <input
                type="email"
                id="email"
                placeholder="Email address"
                autocomplete="email"
                required
                aria-label="Email address"
                />
            </div>

            <!-- Password -->
            <div class="input-group">
                <i class="fas fa-key"></i>
                <input
                type="password"
                id="password"
                placeholder="Password"
                autocomplete="current-password"
                required
                aria-label="Password"
                minlength="6"
                />
                <button
                type="button"
                class="toggle-password"
                id="togglePassword"
                aria-label="Toggle password visibility"
                tabindex="-1"
                >
                <i class="fas fa-eye"></i>
            </button>
        </div>

        <!-- Options -->
        <div class="form-options">
            <label class="remember-me">
                <input type="checkbox" id="remember" />
                Remember me
            </label>
            <a href="#" class="forgot-link">Forgot password?</a>
        </div>

        <!-- Message area -->
        <div class="form-message" id="formMessage"></div>

        <!-- Login Button -->
        <button type="submit" class="btn-login" id="loginBtn">
            <span class="btn-text">Sign In</span>
            <i class="fas fa-arrow-right"></i>
            <span class="spinner"></span>
        </button>

        <!-- Sign up -->
        <div class="signup-link">
            Don't have an account? <a href="#">Sign up</a>
        </div>

    </form>
</div>

<script>
    (function() {
        'use strict';

        // --- DOM refs ---
        const form = document.getElementById('loginForm');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const toggleBtn = document.getElementById('togglePassword');
        const loginBtn = document.getElementById('loginBtn');
        const messageEl = document.getElementById('formMessage');
        const rememberCheck = document.getElementById('remember');

        // --- Helper: show message ---
        function showMessage(text, type) {
            messageEl.textContent = text;
            messageEl.className = 'form-message ' + type;
            // Auto-hide after 5s (success/error)
            if (type === 'success' || type === 'error') {
                clearTimeout(messageEl._timer);
                messageEl._timer = setTimeout(() => {
                    messageEl.className = 'form-message';
                    messageEl.textContent = '';
                }, 5000);
            }
        }

        // --- Helper: clear message ---
        function clearMessage() {
            messageEl.className = 'form-message';
            messageEl.textContent = '';
            clearTimeout(messageEl._timer);
        }

        // --- Toggle password visibility ---
        toggleBtn.addEventListener('click', function() {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            const icon = toggleBtn.querySelector('i');
            icon.className = type === 'password' ? 'fas fa-eye' : 'fas fa-eye-slash';
        });

        // --- Real-time validation styling (optional) ---
        [emailInput, passwordInput].forEach(input => {
            input.addEventListener('blur', function() {
                if (this.value.trim() === '') {
                    this.style.borderColor = 'rgba(239,68,68,0.5)';
                } else {
                    this.style.borderColor = 'rgba(167,139,250,0.5)';
                }
            });
            input.addEventListener('focus', function() {
                this.style.borderColor = '#a78bfa';
            });
        });

        // --- Form submit ---
        form.addEventListener('submit', function(e) {
            e.preventDefault();
            clearMessage();

            // Trim values
            const email = emailInput.value.trim();
            const password = passwordInput.value.trim();

            // --- Validation ---
            if (!email) {
                showMessage('Please enter your email address.', 'error');
                emailInput.focus();
                return;
            }
            // Simple email format check
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                showMessage('Please enter a valid email address.', 'error');
                emailInput.focus();
                return;
            }

            if (!password) {
                showMessage('Please enter your password.', 'error');
                passwordInput.focus();
                return;
            }
            if (password.length < 6) {
                showMessage('Password must be at least 6 characters.', 'error');
                passwordInput.focus();
                return;
            }

            // --- Simulate login request ---
            loginBtn.classList.add('loading');
            loginBtn.disabled = true;

            // Fake API call
            setTimeout(function() {
                // Simulate success (you can change this to check credentials)
                const success = true; // always true for demo

                if (success) {
                    showMessage('✅ Login successful! Redirecting…', 'success');

                    // Store "remember me" in localStorage
                    if (rememberCheck.checked) {
                        localStorage.setItem('rememberedEmail', email);
                    } else {
                        localStorage.removeItem('rememberedEmail');
                    }

                    // Reset button after short delay
                    setTimeout(() => {
                        loginBtn.classList.remove('loading');
                        loginBtn.disabled = false;
                        // Here you would redirect: window.location.href = '/dashboard';
                    }, 1200);

                } else {
                    showMessage('❌ Invalid email or password. Please try again.', 'error');
                    loginBtn.classList.remove('loading');
                    loginBtn.disabled = false;
                }
            }, 1400);
        });

        // --- Restore "remember me" email on page load ---
        const remembered = localStorage.getItem('rememberedEmail');
        if (remembered) {
            emailInput.value = remembered;
            rememberCheck.checked = true;
        }

        // --- Optional: clear error styling on input ---
        emailInput.addEventListener('input', function() {
            if (this.value.trim() !== '') {
                this.style.borderColor = 'rgba(167,139,250,0.5)';
            }
            if (messageEl.classList.contains('error')) {
                clearMessage();
            }
        });
        passwordInput.addEventListener('input', function() {
            if (this.value.trim() !== '') {
                this.style.borderColor = 'rgba(167,139,250,0.5)';
            }
            if (messageEl.classList.contains('error')) {
                clearMessage();
            }
        });

    })();
</script>

</body>
</html>
